<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar lote | Mercabox Araújo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f4;
            color: #172b22;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        form {
            background: white;
            padding: 24px;
            border-radius: 12px;
        }
        label { display: block; margin-top: 16px; }
        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font: inherit;
            border: 1px solid #64756b;
            border-radius: 6px;
        }
        button {
            background: #17643b;
            color: white;
            padding: 14px 24px;
            border: 0;
            border-radius: 6px;
            margin-top: 20px;
            font: inherit;
            cursor: pointer;
        }
        a { color: #174c8b; }
        :focus-visible {
            outline: 3px solid #174cbb;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <h1>Mercabox Araújo</h1>
    <a href="/produtos">Voltar aos produtos</a>
    <a href="/vencimentos">Ver vencimentos</a>
    <h2>Registrar lote</h2>
    <p>Todos os campos são obrigatórios. Informe uma quantidade inteira.</p>

    {% if mensagem %}
        <p role="status">{{ mensagem }}</p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="produto">Produto</label>
        <select id="produto" name="produto_id" required>
            <option value="">Selecione um produto</option>
            {% for produto in produtos %}
                <option value="{{ produto.id }}"
                    {% if dados.get('produto_id') == produto.id|string %}
                    selected
                    {% endif %}>
                    {{ produto.codigo_interno }} — {{ produto.nome }}
                </option>
            {% endfor %}
        </select>

        <label for="lote">Código do lote</label>
        <input id="lote" name="codigo_lote" maxlength="60"
               value="{{ dados.get('codigo_lote', '') }}" required>

        <label for="quantidade">Quantidade de unidades</label>
        <input id="quantidade" name="quantidade" type="number"
               min="0" max="2147483647" step="1"
               value="{{ dados.get('quantidade', '') }}" required>

        <label for="localizacao">Localização no estoque</label>
        <input id="localizacao" name="localizacao" maxlength="120"
               value="{{ dados.get('localizacao', '') }}" required>

        <label for="validade">Data de validade</label>
        <input id="validade" name="data_validade" type="date"
               value="{{ dados.get('data_validade', '') }}" required>

        <button type="submit">Salvar lote</button>
        <a href="/produtos">Cancelar e voltar</a>
    </form>
</body>
</html>
